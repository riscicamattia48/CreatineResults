<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#202427"/>
      <stop offset="100%" stop-color="#15181B"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D69641"/>
      <stop offset="100%" stop-color="#A8631E"/>
    </linearGradient>
  </defs>

  <!-- background squircle -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- weight plate: donut shape -->
  <circle cx="256" cy="278" r="150" fill="url(#plate)"/>
  <circle cx="256" cy="278" r="56" fill="#181B1E"/>

  <!-- molecule node accent (creatine reference), tucked at upper-right of the plate -->
  <g stroke="#ECEAE4" stroke-width="7" fill="none" stroke-linecap="round">
    <line x1="352" y1="164" x2="392" y2="132"/>
    <line x1="392" y1="132" x2="392" y2="86"/>
    <line x1="392" y1="132" x2="436" y2="150"/>
  </g>
  <circle cx="352" cy="164" r="10" fill="#ECEAE4"/>
  <circle cx="392" cy="132" r="8" fill="#ECEAE4"/>
  <circle cx="392" cy="86" r="7" fill="#ECEAE4"/>
  <circle cx="436" cy="150" r="7" fill="#ECEAE4"/>

  <!-- ascending trend line crossing the plate's hole -->
  <polyline points="208,312 234,292 254,308 278,268 306,244"
            fill="none" stroke="#ECEAE4" stroke-width="14"
            stroke-linecap="round" stroke-linejoin="round"/>
</svg>
